<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aadhar Verification System{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-color: #727cf5;
            --secondary-color: #8a969c;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
        }
        
        .card-verification {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .card-verification:hover {
            transform: translateY(-5px);
        }
        
        .btn-primary {
            {% comment %} background: linear-gradient(135deg, var(--secondary-color), #2980b9); {% endcomment %}
            border: none;
            border-radius: 8px;
            padding: 10px 25px;
        }
        
        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .aadhar-input {
            letter-spacing: 2px;
            font-family: monospace;
            font-size: 1.2em;
        }
        
        .otp-input {
            font-size: 1.5em;
            text-align: center;
            letter-spacing: 10px;
        }
        
        .verification-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .step {
            text-align: center;
            flex: 1;
            position: relative;
        }
        
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            {% comment %} background-color: #e9ecef; {% endcomment %}
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
        }
        
        .step.active .step-number {
            background-color: var(--secondary-color);
            color: white;
        }
        
        .step.completed .step-number {
            background-color: var(--success-color);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'aadhar_verification:aadhar_verification_home' %}">
                <i class="bi bi-shield-check"></i> Aadhar Verification
            </a>
            
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'aadhar_verification:aadhar_verification_home' %}">
                    <i class="bi bi-house"></i> Home
                </a>
                <a class="nav-link" href="{% url 'aadhar_verification:initiate_verification' %}">
                    <i class="bi bi-plus-circle"></i> New Verification
                </a>
                <a class="nav-link" href="{% url 'aadhar_verification:verification_list' %}">
                    <i class="bi bi-list-ul"></i> History
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2024 Aadhar Verification System. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script>
        // Theme switcher
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
        }
        
        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);
        
        // Aadhar number formatting
        function formatAadhar(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 4) {
                value = value.substring(0, 4) + ' ' + value.substring(4);
            }
            if (value.length > 9) {
                value = value.substring(0, 9) + ' ' + value.substring(9);
            }
            input.value = value.substring(0, 14);
        }
        
        // Auto-tab for OTP input
        function moveToNext(input, nextFieldId) {
            if (input.value.length >= input.maxLength) {
                document.getElementById(nextFieldId).focus();
            }
        }
    </script>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
