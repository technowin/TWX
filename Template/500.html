<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oops! Something Went Wrong</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #1d2b64, #f8cdda);
      color: white;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }
    h1 {
      font-size: 80px;
      margin: 0;
      animation: float 3s infinite ease-in-out;
    }
    p {
      font-size: 22px;
      margin: 10px 0 20px;
    }
    a {
      display: inline-block;
      padding: 12px 25px;
      background: #fff;
      color: #1d2b64;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.3s;
    }
    a:hover {
      transform: scale(1.1);
    }

    /* Floating animation */
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Background animation */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      overflow: hidden;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      animation: rise 20s infinite ease-in;
    }
    @keyframes rise {
      from { transform: translateY(0); }
      to { transform: translateY(-110vh); }
    }
  </style>
</head>
<body>
  <div class="bubbles">
    <div class="bubble" style="left:10%; width:40px; height:40px; animation-duration:12s;"></div>
    <div class="bubble" style="left:20%; width:20px; height:20px; animation-duration:15s;"></div>
    <div class="bubble" style="left:40%; width:50px; height:50px; animation-duration:18s;"></div>
    <div class="bubble" style="left:60%; width:25px; height:25px; animation-duration:20s;"></div>
    <div class="bubble" style="left:80%; width:35px; height:35px; animation-duration:22s;"></div>
  </div>

  <div class="container">
    <h1>500</h1>
    <p>Oops! Something went wrong on our side.</p>
    <a href="/">Go Back Home</a>
  </div>
</body>
</html>
