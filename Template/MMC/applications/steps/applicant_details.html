{% extends 'MMC/applications/application_wizard.html' %}
{% load static %}

{% block step_content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="card-title mb-0">
            <i class="bi bi-person-vcard"></i>
            Step 1: Applicant Details
        </h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Application Number</label>
                    <input type="text" class="form-control" value="{{ application.application_id }}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Application Date</label>
                    <input type="text" class="form-control" value="{{ application.submitted_date|date:'d/m/Y' }}" readonly>
                </div>
            </div>

            <h6 class="border-bottom pb-2">Personal Information</h6>
            <div class="row">
                <div class="col-md-2 mb-3">
                    <label class="form-label">Prefix</label>
                    <select class="form-select" name="prefix">
                        <option value="">Select</option>
                        <option value="Dr">Dr.</option>
                        <option value="Mr">Mr.</option>
                        <option value="Ms">Ms.</option>
                        <option value="Mrs">Mrs.</option>
                    </select>
                </div>
                <div class="col-md-10 mb-3">
                    <label class="form-label">Full Name (as per documents)</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Father's Name</label>
                    <input type="text" class="form-control" name="father_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Mother's Name</label>
                    <input type="text" class="form-control" name="mother_name" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label">Marital Status</label>
                    <select class="form-select" name="marital_status" required>
                        <option value="">Select</option>
                        <option value="S">Single</option>
                        <option value="M">Married</option>
                        <option value="D">Divorced</option>
                        <option value="W">Widowed</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" name="date_of_birth" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender" required>
                        <option value="">Select</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="category" required>
                        <option value="">Select</option>
                        <option value="GEN">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control" name="mobile" pattern="[0-9]{10}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
            </div>

            <h6 class="border-bottom pb-2">Address Information</h6>
            <div class="row">
                <div class="col-12 mb-3">
                    <label class="form-label">Communication Address</label>
                    <textarea class="form-control" name="communication_address" rows="3" required></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" name="communication_city" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">District</label>
                    <input type="text" class="form-control" name="communication_district" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control" name="communication_state" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Pincode</label>
                    <input type="text" class="form-control" name="communication_pincode" pattern="[0-9]{6}" required>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'application_wizard' %}" class="btn btn-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Save & Continue</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
