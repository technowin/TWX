{% extends 'applications/application_wizard.html' %}
{% load static %}

{% block step_content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="card-title mb-0">
            <i class="bi bi-heart-pulse"></i>
            Step 3: Medical Qualification Details
        </h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i>
                Provide details about your medical qualification and training.
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Medical College/Institution *</label>
                    <input type="text" class="form-control" name="medical_institution" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">University *</label>
                    <input type="text" class="form-control" name="medical_university" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Degree Obtained *</label>
                    <select class="form-select" name="medical_degree" required>
                        <option value="">Select Degree</option>
                        <option value="mbbs">MBBS</option>
                        <option value="bds">BDS</option>
                        <option value="bams">BAMS</option>
                        <option value="bhms">BHMS</option>
                        <option value="bums">BUMS</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Year of Passing *</label>
                    <input type="number" class="form-control" name="medical_year" min="1950" max="2030" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Registration Number</label>
                    <input type="text" class="form-control" name="medical_registration">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Medium of Instruction *</label>
                    <select class="form-select" name="medium_instruction" required>
                        <option value="">Select Medium</option>
                        <option value="english">English</option>
                        <option value="hindi">Hindi</option>
                        <option value="marathi">Marathi</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">OVIR Registration Number</label>
                    <input type="text" class="form-control" name="ovir_registration">
                </div>
            </div>
            
            <div class="row">
                <div class="col-12 mb-3">
                    <label class="form-label">Did you complete any part of the course in India?</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="part_course_india" id="part_yes" value="yes">
                        <label class="form-check-label" for="part_yes">Yes</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="part_course_india" id="part_no" value="no" checked>
                        <label class="form-check-label" for="part_no">No</label>
                    </div>
                </div>
            </div>
            
            <div id="india_course_details" style="display: none;">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Indian College/Institution</label>
                        <input type="text" class="form-control" name="india_institution">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duration (Months)</label>
                        <input type="number" class="form-control" name="india_duration">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label">Subjects Covered in India</label>
                        <textarea class="form-control" name="india_subjects" rows="3"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-12">
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'application_step' application.application_id 2 %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Previous
                        </a>
                        <button type="submit" class="btn btn-primary">
                            Save & Continue <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const partCourseYes = document.getElementById('part_yes');
    const partCourseNo = document.getElementById('part_no');
    const indiaDetails = document.getElementById('india_course_details');
    
    function toggleIndiaDetails() {
        if (partCourseYes.checked) {
            indiaDetails.style.display = 'block';
        } else {
            indiaDetails.style.display = 'none';
        }
    }
    
    partCourseYes.addEventListener('change', toggleIndiaDetails);
    partCourseNo.addEventListener('change', toggleIndiaDetails);
});
</script>
{% endblock %}
