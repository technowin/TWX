{% extends "bootstrap/vertical_base.html" %}
{% load static %}
{% block extra_css %}
<!-- Select2 css -->
<link href="{% static 'css/vendor/select2.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Daterangepicker css -->
<link href="{% static 'css/vendor/daterangepicker.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Touchspin css -->
<link href="{% static 'css/vendor/jquery.bootstrap-touchspin.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Flatpickr Timepicker css -->
<link href="{% static 'css/vendor/flatpickr.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Datepicker css -->
<link href="{% static 'css/vendor/bootstrap-datepicker.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Timepicker css -->
<link href="{% static 'css/vendor/bootstrap-timepicker.min.css' %}" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="{% static 'css/inputs.css' %}" rel="stylesheet" type="text/css" >

<!-- Selectize.js CSS -->
<link href="{% static 'css/selectize.min.css' %}" rel="stylesheet" type="text/css" >
<link href="{% static 'css/form_builder.css' %}" rel="stylesheet" type="text/css" >
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-calendar-week me-2"></i>Machine Planning Details</h2>
</div>

<div class="container-fluid">
    <!-- Machine Planning Form -->
    <div class="card mb-3">
        <form method="post" id="scheduleForm"
            action="{% if schedule %}{% url 'mcp:machine_scheduling_update' schedule.id %}{% else %}{% url 'mcp:machine_scheduling_create' %}{% endif %}">
            {% csrf_token %}
            <div class="card-header bg-primary text-white">General Info</div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="id_name" class="form-label">Schedule Name</label>
                        <input type="text" id="id_name" name="name" class="form-control"
                            value="{{ schedule.name|default:'' }}" placeholder="Enter Schedule Name">
                    </div>
                    <div class="col-md-6">
                        <label for="id_production_order" class="form-label">Production Order</label>
                        <select id="id_production_order" name="production_order" class="form-select">
                            <option value="">-- Select Production Order --</option>
                            {% for po in production_orders %}
                            <option value="{{ po.id }}" {% if schedule.production_order_id == po.id %}selected{% endif %}>
                                {{ po.order_number }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="id_component" class="form-label">Component</label>
                        <select id="id_component" name="component" class="form-select">
                            <option value="">-- Select Component --</option>
                            {% for comp in components %}
                            <option value="{{ comp.id }}" {% if schedule.component_id == comp.id %}selected{% endif %}>
                                {{ comp.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="id_scheduled_start" class="form-label">Scheduled Start</label>
                        <input type="datetime-local" id="id_scheduled_start" name="scheduled_start"
                            class="form-control"
                            {% if schedule.scheduled_start %}
                            value="{{ schedule.scheduled_start|date:'Y-m-d\\TH:i' }}"
                            {% endif %}>
                    </div>

                    <div class="col-md-3">
                        <label for="id_scheduled_end" class="form-label">Scheduled End</label>
                        <input type="datetime-local" id="id_scheduled_end" name="scheduled_end"
                            class="form-control"
                            {% if schedule.scheduled_end %}
                            value="{{ schedule.scheduled_end|date:'Y-m-d\\TH:i' }}"
                            {% endif %}>
                    </div>
                </div>

                <!-- Button -->
                <div class="row">
                    <div class="col-md-12 text-end">
                        <button type="button" id="checkRoutingBtn" class="btn btn-success">
                            <i class="bi bi-search me-1"></i> Check Routings
                        </button>
                    </div>
                </div>
            </div>

            <!-- Calendar -->
            <div id="calendar" class="mt-4"></div>

            <!-- Hidden Routing Info -->
            <div id="routing-card" class="card mb-3 d-none mt-4">
                <div class="card-header bg-info text-white">Routing & Operations</div>
                <div class="card-body">
                    <ul class="nav nav-tabs" id="routingTabs"></ul>
                    <div class="tab-content mt-3" id="routingContent"></div>
                    <div id="productionOrdersWrapper"></div>
                    <input type="hidden" id="assignments_json" name="assignments_json"
                        value="{{ assignments_json|default:'[]' }}">
                </div>
            </div>

            <!-- Save/Cancel -->
            <div class="d-flex justify-content-between mb-4">
                <a href="{% url 'mcp:machine_scheduling_list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Schedule</button>
            </div>
        </form>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
$(document).ready(function() {

    let calendar; // FullCalendar instance

    // Fetch component by production order
    $('#id_production_order').change(function() {
        const productionOrderId = $(this).val();

        if (productionOrderId) {
            $.ajax({
                url: '{% url "mcp:get_component_by_production" %}',
                type: 'GET',
                data: { 'production_order_id': productionOrderId },
                success: function(response) {
                    if (response.component_id && response.component_name) {
                        const componentSelect = $('#id_component');
                        componentSelect.empty().append(
                            $('<option>', {
                                value: response.component_id,
                                text: response.component_name,
                                selected: true
                            })
                        );
                    }
                },
                error: function() {
                    console.error('Error fetching component.');
                }
            });
        } else {
            $('#id_component').empty().append('<option value="">-- Select Component --</option>');
        }
    });

    // Fetch routing data
    $('#checkRoutingBtn').on('click', function() {
        const componentId = $('#id_component').val();

        if (!componentId) {
            alert("Please select a component first!");
            return;
        }

        $.ajax({
            url: "{% url 'mcp:get_routing_data' %}",
            type: "POST",
            data: {
                component_id: componentId,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: function(response) {
                if (response.schedules && response.schedules.length > 0) {
                    renderFullCalendar(response.schedules);
                } else {
                    $('#calendar').html("<p class='text-danger'>No schedules found.</p>");
                }
            },
            error: function(xhr, status, error) {
                console.error(error);
                alert("Error fetching routing data.");
            }
        });
    });

    // Render FullCalendar dynamically
    function renderFullCalendar(scheduleData) {
        if (calendar) {
            calendar.destroy(); // reinitialize if already exists
        }

        const calendarEl = document.getElementById('calendar');
        const events = scheduleData.map(item => ({
            title: "Production: " + item.production_order,
            start: item.start_date,
            end: item.end_date,  // ✅ Added this line
            allDay: true,
            backgroundColor: '#4099ff',
            borderColor: '#4099ff'
        }));


        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 650,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
            },
            events: events,
            themeSystem: 'bootstrap5',
            selectable: true,
            editable: false,
        });

        calendar.render();
    }
});
</script>

{% block extra_javascript %}
<!-- Third party js -->
<script src="{% static 'js/vendor/handlebars.min.js' %}"></script>
<script src="{% static 'js/vendor/typeahead.bundle.min.js' %}"></script>
<script src="{% static 'js/vendor/bootstrap-timepicker.min.js' %}"></script>
<script src="{% static 'js/vendor/flatpickr.min.js' %}"></script>
<script src="{% static 'js/selectize.min.js' %}"></script>
<!-- Init js -->
<script src="{% static 'js/pages/demo.typehead.js' %}"></script>
<script src="{% static 'js/pages/demo.timepicker.js' %}"></script>
{% endblock %}

{% endblock %}
