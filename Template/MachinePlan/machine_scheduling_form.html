{% block content %}
<style>
.calendar-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px;
            margin-top: 20px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .calendar-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .shift-legend {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
        }
        
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        
        /* FullCalendar customizations */
        .fc {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .fc-toolbar {
            padding: 10px;
            background-color: var(--light-bg);
            border-radius: var(--border-radius);
        }
        
        .fc-toolbar-title {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .fc-button {
            background-color: var(--secondary-color) !important;
            border: none !important;
            font-weight: 500;
        }
        
        .fc-button:hover {
            background-color: #2980b9 !important;
        }
        
        .fc-button-active {
            background-color: var(--primary-color) !important;
        }
        
        .fc-daygrid-day {
            position: relative;
        }
        
        .fc-daygrid-day-number {
            font-weight: 600;
            padding: 5px !important;
        }
        
        .shift-indicators {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 2px;
        }
        
        .shift-indicator {
            height: 4px;
            flex: 1;
            max-width: 30px;
            border-radius: 2px;
        }
        
        .holiday-cell {
            background-color: #f8d7da !important;
            position: relative;
        }
        
        .weekly-off-cell {
            background-color: #e9ecef !important;
            position: relative;
        }
        
        .holiday-label, .weekly-off-label {
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7em;
            color: #6c757d;
            pointer-events: none;
        }
        
        .fully-occupied {
            background-color: #f8d7da !important;
            position: relative;
        }
        
        .fully-occupied::after {
            content: "FULL";
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7em;
            color: #721c24;
            font-weight: bold;
            pointer-events: none;
        }
        
        .btn-primary {
            background-color: var(--secondary-color);
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-available {
            background-color: #28a745;
        }
        
        .status-partial {
            background-color: #ffc107;
        }
        
        .status-full {
            background-color: #dc3545;
        }

</style>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-calendar-week me-2"></i>Machine Planning Details</h2>
</div>

<div class="container-fluid">
    <!-- Machine Planning Form -->
    <div class="card mb-3">
        <form method="post" id="scheduleForm"

            <div class="card-header bg-primary text-white">General Info</div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="id_name" class="form-label">Schedule Name</label>
                        <input type="text" id="id_name" name="name" class="form-control"
                            value="{{ schedule.name|default:'' }}" placeholder="Enter Schedule Name">
                    </div>

                    <input type="hidden" id ="index" name = "index" value = {{ index }}>
                    <div class="col-md-4">
                            <label for="id_production_order" class="form-label">Production Order</label>
                            <select id="id_production_order" name="production_order" class="form-select">
                                <option value="">-- Select Production Order --</option>
                                {% for po in production_orders %}
                                    <option value="{{ po.id }}"
                                        {% if po_order and po_order|stringformat:"s" == po.id|stringformat:"s" %}

        <div></div>    
        <div></div>    
        <div></div>    
        <div></div>    
        </div>

        <input type="hidden" id="assignments_json" name="assignments_json" value="{{ assignments_json|default:'[]' }}">

        <input type="hidden" id="shift_table_json" name="shift_table_json" value="{{ shift_table_json|default:'[]' }}">




            <!-- Save/Cancel -->
          <div class="d-flex justify-content-between mb-4" id="savebutton" style="display: none !important;">
                <a href="{% url 'mcp:machine_scheduling_list' %}" class="btn btn-secondary">Cancel</a>

<script>
     let calendar; // FullCalendar instance
     let productionPlan = []; // make it global
$(document).ready(function () {

    //let calendar; // FullCalendar instance

    // 🔹 Step 1: Fetch component when production order changes
    $('#id_production_order').change(function () {
        const productionOrderId = $(this).val();

        if (productionOrderId) {
            $.ajax({
                url: '{% url "mcp:get_component_by_production" %}',
                type: 'GET',
                data: { production_order_id: productionOrderId },
                success: function (response) {
                    const componentSelect = $('#id_component');
                    componentSelect.empty();

                    if (response.component_id && response.component_name) {
                        componentSelect.append(
                            $('<option>', {
                                value: response.component_id,
                                text: response.component_name,
                                selected: true
                            })
                        );
                    } else {
                        componentSelect.append('<option value="">-- No Component Found --</option>');
                    }
                },
                error: function () {
                    console.error('Error fetching component.');
                }
            });
        } else {
            $('#id_component').empty().append('<option value="">-- Select Component --</option>');
        }
    });

    // 🔹 Step 2: Fetch routing data and render calendar
     $('#checkRoutingBtn').on('click', function () {
            const componentId = $('#id_component').val();

            if (!componentId) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Component Required',
                    text: 'Please select a component first!',
                    confirmButtonColor: '#3498db'
                });
                return;
            }

            $.ajax({
                url: "{% url 'mcp:get_routing_data' %}",
                type: "POST",
                data: {
                    component_id: componentId,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function (response) {
                    // ✅ Store routing ID globally
                    if (response.routing_id) {
                        window.currentRoutingId = response.routing_id;
                    } else {
                        console.warn("No routing ID returned from server.");
                    }

                    // ✅ Extract data safely
                    const schedules = response.schedules || [];
                    const holidays = response.holidays || [];
                    const weeklyOff = response.weekly_off || null;
                    shiftColors = response.shift_colors || {};
                    allShifts = response.all_shifts || [];
                    
                    // Create shift order array
                    shiftOrder = allShifts.map(shift => shift.code);
                    
                    // ✅ Render calendar with all info (schedules, holidays, weekly off)
                    renderFullCalendar(schedules, holidays, weeklyOff);

                    // ✅ Show date input fields
                    $('#start_date').removeAttr('hidden');
                    $('#end_date').removeAttr('hidden');
                },

                error: function (xhr, status, error) {
                    console.error("Error fetching routing data:", error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Error fetching routing data.',
                        confirmButtonColor: '#e74c3c'
                    });
                }
            });
        });

        function renderFullCalendar(scheduleData, holidays = [], weeklyOffDay = null) {
            if (calendar) {
                calendar.destroy();
            }

            const calendarEl = document.getElementById('calendar');
            
            // Convert holidays to dictionary for easy lookup
            const holidayMap = {};
            holidays.forEach(h => {
                const dateStr = new Date(h.date).toLocaleDateString('en-CA');
                holidayMap[dateStr] = h.description;
            });
            
            // Create events for the calendar (for the day grid)
            const events = [];
            const dateStatus = {}; // Track which dates are fully occupied
            
            scheduleData.forEach(dayData => {
                const dateStr = dayData.date;
                const shifts = dayData.shifts || {};
                const shiftCodes = Object.keys(shifts);
                
                // Check if all shifts are occupied
                const allShiftsOccupied = shiftOrder.every(shiftCode => shifts[shiftCode]);
                
                if (allShiftsOccupied) {
                    dateStatus[dateStr] = 'full';
                } else if (shiftCodes.length > 0) {
                    dateStatus[dateStr] = 'partial';
                }
                
                // Add events for each shift
                shiftCodes.forEach(shiftCode => {
                    const shiftDetails = shifts[shiftCode];
                    
                    shiftDetails.forEach(detail => {
                        const startTime = detail.start_time ? new Date(detail.start_time) : null;
                        const endTime = detail.end_time ? new Date(detail.end_time) : null;
                        
                        if (startTime && endTime) {
                            events.push({
                                title: `${detail.production_order} (${shiftCode})`,
                                start: startTime,
                                end: endTime,
                                backgroundColor: shiftColors[shiftCode] || shiftColors["Default"],
                                borderColor: shiftColors[shiftCode] || shiftColors["Default"],
                                textColor: 'white',
                                extendedProps: {
                                    production_order: detail.production_order,
                                    shift_code: shiftCode,
                                    start_time: detail.start_time,
                                    end_time: detail.end_time,
                                    employee: detail.employee,
                                    quantity: detail.quantity,
                                    machine: detail.machine
                                }
                            });
                        }
                    });
                });
            });

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 700,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
                },
                themeSystem: 'standard',
                events: events,
                selectable: true,
                editable: false,
                dayMaxEvents: 2,
                
                // Custom day cell rendering
                dayCellDidMount: function(arg) {
                    const dateStr = arg.date.toLocaleDateString('en-CA');
                    const dayName = arg.date.toLocaleDateString('en-US', { weekday: 'long' });
                    const cell = arg.el;
                    
                    // Add classes based on day status
                    if (holidayMap[dateStr]) {
                        cell.classList.add('holiday-cell');
                        
                        const desc = document.createElement('div');
                        desc.textContent = holidayMap[dateStr];
                        desc.classList.add('holiday-label');
                        cell.appendChild(desc);
                    } else if (weeklyOffDay && dayName === weeklyOffDay) {
                        cell.classList.add('weekly-off-cell');
                        
                        const off = document.createElement('div');
                        off.textContent = 'Weekly Off';
                        off.classList.add('weekly-off-label');
                        cell.appendChild(off);
                    } else if (dateStatus[dateStr] === 'full') {
                        cell.classList.add('fully-occupied');
                    }
                    
                    // Add shift indicators
                    if (scheduleData.some(day => day.date === dateStr)) {
                        const dayData = scheduleData.find(day => day.date === dateStr);
                        const shifts = dayData.shifts || {};
                        
                        const indicators = document.createElement('div');
                        indicators.classList.add('shift-indicators');
                        
                        shiftOrder.forEach(shiftCode => {
                            if (shifts[shiftCode]) {
                                const indicator = document.createElement('div');
                                indicator.classList.add('shift-indicator');
                                indicator.style.backgroundColor = shiftColors[shiftCode] || shiftColors["Default"];
                                indicators.appendChild(indicator);
                            }
                        });
                        
                        cell.appendChild(indicators);
                    }
                },
                
                // Event click handler
                eventClick: function(info) {
                    const event = info.event;
                    const extendedProps = event.extendedProps;
                    
                    let detailsHtml = `
                        <div class="text-start">
                            <p><strong>Production Order:</strong> ${extendedProps.production_order}</p>
                            <p><strong>Shift:</strong> ${extendedProps.shift_code}</p>
                            <p><strong>Start Time:</strong> ${new Date(extendedProps.start_time).toLocaleString()}</p>
                            <p><strong>End Time:</strong> ${new Date(extendedProps.end_time).toLocaleString()}</p>
                    `;
                    
                    if (extendedProps.employee) {
                        detailsHtml += `<p><strong>Employee:</strong> ${extendedProps.employee}</p>`;
                    }
                    
                    if (extendedProps.quantity) {
                        detailsHtml += `<p><strong>Quantity:</strong> ${extendedProps.quantity}</p>`;
                    }
                    
                    if (extendedProps.machine) {
                        detailsHtml += `<p><strong>Machine:</strong> ${extendedProps.machine}</p>`;
                    }
                    
                    detailsHtml += `</div>`;
                    
                    Swal.fire({
                        title: 'Shift Details',
                        html: detailsHtml,
                        icon: 'info',
                        confirmButtonColor: '#3498db'
                    });
                },
                
                // Date click handler
                dateClick: function(info) {
                    const clickedDate = info.dateStr;
                    const clickedDayName = new Date(clickedDate).toLocaleDateString('en-US', { weekday: 'long' });
                    
                    // Check for weekly off
                    if (weeklyOffDay && clickedDayName === weeklyOffDay) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Weekly Off',
                            text: `You can't assign a shift on this Weekly Off day (${weeklyOffDay}).`,
                            confirmButtonColor: '#f39c12'
                        });
                        return;
                    }
                    
                    // Check for holiday
                    if (holidayMap[clickedDate]) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Holiday',
                            text: `You can't assign a shift on this Holiday: ${holidayMap[clickedDate]}`,
                            confirmButtonColor: '#f39c12'
                        });
                        return;
                    }
                    
                    // Check if date is fully occupied
                    if (dateStatus[clickedDate] === 'full') {
                        Swal.fire({
                            icon: 'error',
                            title: 'Fully Occupied',
                            text: 'This date is fully occupied with shifts. Please select another date.',
                            confirmButtonColor: '#e74c3c'
                        });
                        return;
                    }
                    
                    // Normal click behavior
                    $('#id_scheduled_start').val(clickedDate + "T10:00");
                    const routingId = window.currentRoutingId;
                    if (!routingId) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Routing Required',
                            text: 'No routing ID found. Please click "Check Routings" first.',
                            confirmButtonColor: '#f39c12'
                        });
                        return;
                    }
                    
                    loadRoutingDetails(routingId);
                    $('#calculateDate').removeAttr('hidden');
                    $('#savebutton').show();
                    
                    // Show success message
                    Swal.fire({
                        icon: 'success',
                        title: 'Date Selected',
                        text: `You've selected ${clickedDate}. Now you can assign a shift.`,
                        confirmButtonColor: '#2ecc71',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });

            calendar.render();
            
            // Add legend after calendar is rendered
            addShiftLegend();
        }
        
        function addShiftLegend() {
            // Remove existing legend if any
            $('.shift-legend').remove();
            
            const legend = $('<div class="shift-legend mt-3"></div>');
            
            // Add legend items for each shift
            shiftOrder.forEach(shiftCode => {
                const color = shiftColors[shiftCode] || shiftColors["Default"];
                const shiftName = allShifts.find(s => s.code === shiftCode)?.name || shiftCode;
                
                const legendItem = $(`
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${color};"></div>
                        <span>${shiftName}</span>
                    </div>
                `);
                
                legend.append(legendItem);
            });
            
            $('#calendar').after(legend);
        }



    // 🔹 Step 4: Load Routing Details
    function loadRoutingDetails(routingId) {
        $.ajax({
            url: "{% url 'mcp:get_routing_details' %}",
            type: "GET",
            data: { routing_id: routingId },
            success: function (response) {
                if (response.routing_details && response.routing_details.length > 0) {
                    renderRoutingDetailsTable(response.routing_details);
                    $('#routing-card').removeClass('d-none');
                } else {
                    $('#routingContent').html("<p class='text-danger'>No routing details found.</p>");
                }
            },
            error: function (xhr, status, error) {
                console.error(error);
                alert("Error fetching routing details.");
            }
        });
    }

    // 🔹 Step 5: Render Routing Table (with workstations & employees)
 // 🔹 Step 5: Render Routing Table (direct workstation + employee count)
function renderRoutingDetailsTable(details) {
    let tableHtml = `
        <table class="table table-bordered mt-3">
            <thead class="table-primary">
                <tr>
                    <th width="2%">Seq</th>
                    <th width="8%">Operation</th>
                    <th width="15%">Emp need with skill</th>
                    <th width="10%">Work Center</th>
                    <th width="15%">Workstation</th>
                    <th width="15%">Machine</th>
                    <th width="30%">Employee</th>
                </tr>
            </thead>
            <tbody>
    `;

    details.forEach((d, index) => {
    tableHtml += `
         <tr data-routing-detail-id="${d.routing_detail_id}">
            <td>${d.sequence}</td>
            <td>${d.operation}</td>
            <td>${d.employee_needed}-${d.skill}(${d.proficiency})
            <td>${d.work_center}</td>
            <td>
                <select class="form-select workstation-select" data-row="${index}">
                    <option value="">-- Select Workstation --</option>
                    ${
                        d.workstations && d.workstations.length > 0
                        ? d.workstations.map(ws => 
                            `<option value="${ws.id}">${ws.name} (${ws.employee_count} Employees)</option>`
                          ).join('')
                        : '<option value="">No Workstations Available</option>'
                    }
                </select>
            </td>
            <td>
                <select class="form-select machine-select" data-row="${index}">
                    <option value="">-- Select Machine --</option>
                </select>
            </td>
            <td>
                <select class="form-select employee-select" data-row="${index}">
                    <option value="">-- Select Employee --</option>
                </select>

function formatDateTime(dateStr) {
    if (!dateStr) return "";
    const dt = new Date(dateStr);
    const day = String(dt.getDate()).padStart(2, '0');
    const month = String(dt.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
    const year = dt.getFullYear();
    const hours = String(dt.getHours()).padStart(2, '0');
    const minutes = String(dt.getMinutes()).padStart(2, '0');
    return `${day}-${month}-${year} ${hours}:${minutes}`;
}

   
$('#calculateEndDateBtn').on('click', function () {
    const productionId = $('#id_production_order').val();
    const scheduledStart = $('#id_scheduled_start').val();
    const routingId = window.currentRoutingId;

    if (!productionId) { alert("Please select a production order first!"); return; }
    if (!scheduledStart) { alert("Please select a start date first!"); return; }
    if (!calendar) { alert("Please click 'Check Routings' first to load the calendar!"); return; }

    let routingData = [];
    $('tr[data-routing-detail-id]').each(function () {
        const row = $(this);
        const routingDetailId = row.data('routing-detail-id');
        const sequence = row.find('td').eq(0).text();
        const workstationId = row.find('.workstation-select').val();
        const machineId = row.find('.machine-select').val();
        let employeeIds = row.find('.employee-select')[0].selectize
                          ? row.find('.employee-select')[0].selectize.items
                          : row.find('.employee-select').val() || [];

        routingData.push({
            routing_detail_id: routingDetailId,
            workstation_id: workstationId || null,
            machine_id: machineId || null,
            sequence: sequence,
            employee_ids: employeeIds
        });
    });

    if (routingData.some(r => !r.workstation_id || !r.machine_id || r.employee_ids.length === 0)) {
        alert("Please select workstations, machines, and employees for all operations!");
        return;
    }

    $('#calculateEndDateBtn').prop('disabled', true).text('Calculating...');

    $.ajax({
        url: "{% url 'mcp:calculate_end_date' %}",
        type: "POST",
        data: {
            production_id: productionId,
            routing_id: routingId,
            scheduled_start: scheduledStart,
            routing_data: JSON.stringify(routingData),
            csrfmiddlewaretoken: '{{ csrf_token }}'
        },
        success: function (response) {
            $('#calculateEndDateBtn').prop('disabled', false).text('Calculate End Date');

            if (!response.success) {
                alert(response.error || "Failed to calculate end date.");
                return;
            }

            const formattedEndDate = response.estimated_end_date.replace(" ", "T");
            $('#id_scheduled_end').val(formattedEndDate);

            const productionTitle = "Production: " + $('#id_production_order option:selected').text();
            const startDate = $('#id_scheduled_start').val();

            // Calendar
            const existingEvent = calendar.getEvents().find(e => e.title === productionTitle);
            if (existingEvent) existingEvent.remove();
            calendar.addEvent({
                title: productionTitle,
                start: startDate,
                end: formattedEndDate,
                allDay: true,
                backgroundColor: '#4099ff',
                borderColor: '#4099ff'
            });

            // Save plan globally
            productionPlan = response.production_plan || [];
            const totalQty = response.total_quantity || 0;

            renderShiftTable(productionPlan, totalQty);
        },
        error: function (xhr) {
            alert("Error calculating end date: " + xhr.responseText);
        }
    });
});

// Function to render the table
function renderShiftTable(plan, totalQty) {
    let remainingBySequence = {};
    let tableHtml = `
        <table id="shiftTable" class="table table-bordered table-striped">
            <thead>
                <tr class="bg-light">
                    <th width="5%">Row ID</th>
                    <th width="5%">Sequence</th>
                    <th width="10%">Workstation</th>
                    <th width="10%">Machine</th>
                    <th width="15%">Employees</th>
                    <th width="10%">Shift</th>
                    <th width="10%">Start</th>
                    <th width="10%">End</th>
                    <th width="10%">Total Quantity</th>
                    <th width="10%">Completed Quantity</th>
                    <th width="10%">Remaining Quantity</th>
                    <th width="5%">Action</th>
                </tr>
            </thead>
            <tbody>
    `;

    plan.forEach((item, index) => {
        // Format dates properly
      
        let empList = "";
        if (Array.isArray(item.employee_ids)) {
            empList = item.employee_ids.join(', ');
        } else if (typeof item.employee_ids === "string") {
            empList = item.employee_ids;
        }

        // Initialize per-sequence remaining
        if (!remainingBySequence[item.sequence]) remainingBySequence[item.sequence] = totalQty;

        // Subtract processed quantity
        remainingBySequence[item.sequence] -= item.quantity_processed || 0;
        const remainingQty = Math.max(remainingBySequence[item.sequence], 0);

        tableHtml += `
            <tr data-row-id="${index}" data-sequence="${item.sequence || ''}" data-routing-detail-id="${item.routing_detail_id || ''}">
                <td>${index}</td>
                <td>${item.sequence || ""}</td>
                <td>${item.workstation || ""}</td>
                <td>${item.machine || ""}</td>
                <td>${empList}</td>
                <td>${item.shift_name || ""}</td>
                <td>${formatDateTime(item.start)}</td>
                <td>${formatDateTime(item.end)}</td>
                <td class="total-qty">${totalQty}</td>
                <td class="completed-qty">${item.quantity_processed || 0}</td>
                <td class="remaining-qty">${remainingQty}</td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm remove-row-btn">Remove</button>
                </td>
            </tr>
        `;
    });

    tableHtml += `</tbody></table>`;
    $('#shiftContent').html(tableHtml);
    $('#shift_table').removeClass('d-none');
}
