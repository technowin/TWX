{% extends "bootstrap/vertical_base.html" %}
{% load static %}
{% block extra_css %}

<link href="{% static 'css/vendor/select2.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Daterangepicker css -->
<link href="{% static 'css/vendor/daterangepicker.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Touchspin css -->
<link href="{% static 'css/vendor/jquery.bootstrap-touchspin.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Flatpickr Timepicker css -->
<link href="{% static 'css/vendor/flatpickr.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Datepicker css -->
<link href="{% static 'css/vendor/bootstrap-datepicker.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Timepicker css -->
<link href="{% static 'css/vendor/bootstrap-timepicker.min.css' %}" rel="stylesheet" type="text/css" />
<link href="{% static 'css/vendor/fullcalendar.min.css' %}" rel="stylesheet" type="text/css" />


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="{% static 'css/inputs.css' %}" rel="stylesheet" type="text/css" >

<!-- Selectize.js CSS -->
<link href="{% static 'css/selectize.min.css' %}" rel="stylesheet" type="text/css" >
<link href="{% static 'css/form_builder.css' %}" rel="stylesheet" type="text/css" >
{% endblock %} 
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-calendar-week me-2"></i>Edit Machine Planning</h2>
</div>

<div class="container-fluid">
  <div class="card mb-3">
    <form method="post" id="scheduleForm" action="{% url 'mcp:machine_scheduling_update' schedule.id %}">
      {% csrf_token %}
      <div class="card-header bg-primary text-white">General Info</div>
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Schedule Name</label>
            <input type="text" name="name" class="form-control" value="{{ schedule.name }}">
          </div>

          <div class="col-md-4">
            <label class="form-label">Production Order</label>
            <select name="production_order" id="id_production_order" class="form-select" >
              {% for po in production_orders %}
              <option value="{{ po.id }}" {% if schedule.production_order_id == po.id %}selected{% endif %}>
                {{ po.order_number }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Component</label>
            <select name="component" id="id_component" class="form-select">
              {% for comp in components %}
              <option value="{{ comp.id }}" {% if schedule.component_id == comp.id %}selected{% endif %}>
                {{ comp.name }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Calendar -->
        <div id="calendar" class="mt-4"></div>

        <!-- Scheduled Dates -->
        <div class="row mt-4">
          <div class="col-md-6">
            <label for="id_scheduled_start" class="form-label">Scheduled Start</label>
            <input type="datetime-local" id="id_scheduled_start" name="scheduled_start" class="form-control"
              value="{{ schedule.scheduled_start|date:'Y-m-d\\TH:i' }}">
          </div>

          <div class="col-md-6">
            <label for="id_scheduled_end" class="form-label">Scheduled End</label>
            <input type="datetime-local" id="id_scheduled_end" name="scheduled_end" class="form-control"
              value="{{ schedule.scheduled_end|date:'Y-m-d\\TH:i' }}">
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-md-12 text-end">
            <button type="button" id="calculateEndDateBtn" class="btn btn-warning">
              <i class="bi bi-calculator me-1"></i> Calculate End Date
            </button>
          </div>
        </div>

        <!-- Routing details -->
        <div id="routing-card" class="card mb-3 mt-4">
          <div class="card-header bg-info text-white">Routing & Operations</div>
          <div class="card-body">
            <div id="routingContent"></div>
          </div>
        </div>

        <!-- Shift Table -->
        <div id="shift_table" class="card mb-3 mt-4">
          <div class="card-header bg-success text-white">Shift Details</div>
          <div class="card-body">
            <div id="shiftContent"></div>
          </div>
        </div>

        <input type="hidden" id="assignments_json" name="assignments_json" value="{{ assignments_json|default:'[]' }}">
        <input type="hidden" id="shift_table_json" name="shift_table_json" value="{{ shift_table_json|default:'[]' }}">

        <!-- Save / Cancel -->
        <div class="d-flex justify-content-between mb-4">
          <a href="{% url 'mcp:machine_scheduling_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update Plan</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/vendor/fullcalendar.min.js' %}"></script>

<script>
// Debug the raw JSON data
// Debug the raw JSON data
console.log("=== RAW ASSIGNMENTS JSON ===");
var assignmentsData = {{ assignments_json|safe }};
console.log(assignmentsData);

console.log("=== RAW SHIFT TABLE JSON ===");
var shiftTableData = {{ shift_table_json|safe }};
console.log("Shift table data:", shiftTableData);
console.log("Shift table data type:", typeof shiftTableData);
console.log("Shift table data length:", shiftTableData ? shiftTableData.length : 0);

if (shiftTableData && shiftTableData.length > 0) {
    console.log("First shift record:", shiftTableData[0]);
} else {
    console.log("No shift table data found");
}

// Store the pre-assignments data globally
window.preAssignments = assignmentsData;
window.shiftTableData = shiftTableData;

// Define renderShiftTable function in global scope
function renderShiftTable(shiftData) {
    console.log("Rendering shift table:", shiftData);
    
    if (!shiftData || shiftData.length === 0) {
        $("#shiftContent").html('<div class="alert alert-info">No shift data available</div>');
        return;
    }

    let tableHtml = `
        <table class="table table-bordered table-striped">
            <thead class="table-success">
                <tr>
                    <th>Sequence</th>
                    <th>Workstation</th>
                    <th>Machine</th>
                    <th>Employees</th>
                    <th>Shift</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Total Qty</th>
                    <th>Completed Qty</th>
                    <th>Remaining Qty</th>
                </tr>
            </thead>
            <tbody>
    `;

    shiftData.forEach(shift => {
        tableHtml += `
            <tr>
                <td>${shift.sequence || ''}</td>
                <td>${shift.workstation || ''}</td>
                <td>${shift.machine || ''}</td>
                <td>${Array.isArray(shift.employee_ids) ? shift.employee_ids.join(', ') : shift.employee_ids || ''}</td>
                <td>${shift.shift_name || ''}</td>
                <td>${shift.start || ''}</td>
                <td>${shift.end || ''}</td>
                <td>${shift.total_quantity || 0}</td>
                <td>${shift.completed_quantity || 0}</td>
                <td>${shift.remaining_quantity || 0}</td>
            </tr>
        `;
    });

    tableHtml += `</tbody></table>`;
    $("#shiftContent").html(tableHtml);
    
    // Show the shift table section
    $("#shift_table").removeClass('d-none');
}

// Render shift table immediately
if (shiftTableData && shiftTableData.length > 0) {
    renderShiftTable(shiftTableData);
} else {
    console.log("No shift data to render");
    $("#shiftContent").html('<div class="alert alert-warning">No shift data available</div>');
    $("#shift_table").removeClass('d-none'); // Still show the section even if empty
}
</script>

<script>
let calendar;
$(document).ready(function() {
  const componentId = "{{ schedule.component_id }}";
  const start = "{{ schedule.scheduled_start|date:'Y-m-d\\TH:i' }}";
  const end = "{{ schedule.scheduled_end|date:'Y-m-d\\TH:i' }}";

  // 🔹 Load routing + calendar on load
  if (componentId) {
    $.ajax({
      url: "{% url 'mcp:get_routing_data' %}",
      type: "POST",
      data: {
        component_id: componentId,
        csrfmiddlewaretoken: '{{ csrf_token }}'
      },
      success: function(response) {
        if (response.routing_id) window.currentRoutingId = response.routing_id;

        // Render calendar with existing schedule
        if (response.schedules && response.schedules.length > 0)
          renderFullCalendar(response.schedules);
        else
          renderFullCalendar([]);

        // Load routing table WITH pre-assignments
        loadRoutingDetails(window.currentRoutingId, window.preAssignments);
      },
      error: function() {
        alert("Error loading routing data.");
      }
    });
  }

  function renderFullCalendar(scheduleData) {
    if (calendar) calendar.destroy();

    const events = scheduleData.map(item => ({
      title: "Production: " + item.production_order,
      start: item.start_date,
      end: item.end_date,
      allDay: true,
      backgroundColor: '#4099ff'
    }));

    // add this schedule itself if exists
    if (start && end) {
      events.push({
        title: "Current Schedule",
        start: start,
        end: end,
        allDay: true,
        backgroundColor: '#0d6efd'
      });
    }

    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      height: 650,
      headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
      events: events,
      themeSystem: 'bootstrap5'
    });

    calendar.render();
  }

  function loadRoutingDetails(routingId, preAssignments) {
    $.ajax({
      url: "{% url 'mcp:get_routing_details' %}",
      type: "GET",
      data: { routing_id: routingId },
      success: function(response) {
        if (response.routing_details && response.routing_details.length > 0) {
          // Merge the routing details with pre-assignments data
          const mergedDetails = response.routing_details.map(detail => {
            // Find matching pre-assignment by sequence
            const preAssignment = preAssignments.find(pa => 
              pa.sequence == detail.sequence || pa.routing_detail_id == detail.id
            );
            
            if (preAssignment) {
              return {
                ...detail,
                routing_detail_id: preAssignment.routing_detail_id,
                workstation_id: preAssignment.workstation_id,
                machine_id: preAssignment.machine_id,
                employee_ids: preAssignment.employee_ids,
                workstations: preAssignment.workstations || detail.workstations,
                machines: preAssignment.machines || detail.machines,
                employees: preAssignment.employees || detail.employees
              };
            }
            return detail;
          });
          
          renderRoutingDetailsTable(mergedDetails);
        }
      }
    });
  }
function renderRoutingDetailsTable(details) {
    console.log("=== RENDER FUNCTION DEBUG ===");
    console.log("Details received:", details);
    
    let tableHtml = `
        <table class="table table-bordered mt-3">
            <thead class="table-primary">
                <tr>
                    <th width="2%">Seq</th>
                    <th width="8%">Operation</th>
                    <th width="15%">Emp need with skill</th>
                    <th width="10%">Work Center</th>
                    <th width="15%">Workstation</th>
                    <th width="15%">Machine</th>
                    <th width="30%">Employee</th>
                </tr>
            </thead>
            <tbody>
    `;

    details.forEach((d, index) => {
        console.log(`Processing row ${index}:`, d);
        
        // Get values with fallbacks
        const workstationId = d.workstation_id !== undefined ? d.workstation_id : null;
        const machineId = d.machine_id !== undefined ? d.machine_id : null;
        const employeeIds = d.employee_ids !== undefined ? d.employee_ids : [];
        
        console.log(`Row ${index} values:`, {
            workstationId,
            machineId, 
            employeeIds
        });

        tableHtml += `
            <tr data-routing-detail-id="${d.routing_detail_id}">
                <td>${d.sequence || ''}</td>
                <td>${d.operation || ''}</td>
                <td>${d.employee_needed || 0}-${d.skill || ''}(${d.proficiency || ''})</td>
                <td>${d.work_center || ''}</td>
                <td>
                    <select class="form-select workstation-select" data-row="${index}">
                        <option value="">-- Select Workstation --</option>
        `;
        
        // Workstation options
        if (d.workstations && d.workstations.length > 0) {
            d.workstations.forEach(ws => {
                const isSelected = ws.id == workstationId;
                console.log(`Workstation ${ws.id} == ${workstationId}: ${isSelected}`);
                tableHtml += `<option value="${ws.id}" ${isSelected ? 'selected="selected"' : ''}>${ws.name}</option>`;
            });
        }
        
        tableHtml += `
                    </select>
                </td>
                <td>
                    <select class="form-select machine-select" data-row="${index}">
                        <option value="">-- Select Machine --</option>
        `;
        
        // Machine options
        if (d.machines && d.machines.length > 0) {
            d.machines.forEach(machine => {
                const isSelected = machine.id == machineId;
                tableHtml += `<option value="${machine.id}" ${isSelected ? 'selected="selected"' : ''}>${machine.name}</option>`;
            });
        }
        
        tableHtml += `
                    </select>
                </td>
                <td>
                    <select class="form-select employee-select" data-row="${index}" multiple>
                        <option value="">-- Select Employee --</option>
        `;
        
        // Employee options
        if (d.employees && d.employees.length > 0) {
            d.employees.forEach(employee => {
                const employeeIdStr = String(employee.id);
                const isSelected = employeeIds.some(id => String(id) === employeeIdStr);
                console.log(`Employee ${employeeIdStr} in [${employeeIds.map(e => String(e))}]: selected=${isSelected}`);
                tableHtml += `<option value="${employee.id}" ${isSelected ? 'selected="selected"' : ''}>${employee.employee_name}</option>`;
            });
        }
        
        tableHtml += `
                    </select>
                </td>
            </tr>
        `;
    });

    tableHtml += `</tbody></table>`;
    $("#routingContent").html(tableHtml);
    
    // Initialize Selectize on all employee dropdowns
    initializeSelectize();
    
    // Attach event listeners after rendering
    attachEventListeners();
}

function initializeSelectize() {
    $('.employee-select').each(function() {
        const $select = $(this);
        const preselectedValues = $select.find('option:selected').map(function() {
            return $(this).val();
        }).get();
        
        console.log('Initializing Selectize with preselected values:', preselectedValues);
        
        $select.selectize({
            plugins: ['remove_button'],
            delimiter: ',',
            persist: false,
            create: false,
            maxItems: null,
            placeholder: 'Select employees...',
            render: {
                item: function(data, escape) {
                    return '<div>"' + escape(data.text) + '"</div>';
                }
            },
            onInitialize: function() {
                // Set the pre-selected values after initialization
                const selectize = this;
                if (preselectedValues.length > 0) {
                    selectize.setValue(preselectedValues);
                }
            }
        });
    });
}
  function attachEventListeners() {
    // Workstation change event
    $('.workstation-select').on('change', function() {
        const rowIndex = $(this).data('row');
        const workstationId = $(this).val();
        const machineSelect = $(`.machine-select[data-row="${rowIndex}"]`);
        const employeeSelect = $(`.employee-select[data-row="${rowIndex}"]`);
        
        // Clear previous options
        machineSelect.html('<option value="">-- Select Machine --</option>');
        employeeSelect.html('<option value="">-- Select Employee --</option>');
        
        if (workstationId) {
            // You can add AJAX calls here to dynamically load machines and employees
            // based on the selected workstation
            console.log(`Workstation ${workstationId} selected for row ${rowIndex}`);
        }
    });
  }

  

  // ✅ Keep calculate end date same as create page
  $('#calculateEndDateBtn').on('click', function() {
    const productionId = $('#id_production_order').val();
    const scheduledStart = $('#id_scheduled_start').val();
    let workstationIds = [];
    $('.workstation-select').each(function() {
      const wsId = $(this).val();
      if (wsId) workstationIds.push(wsId);
    });

    $.ajax({
      url: "{% url 'mcp:calculate_end_date' %}",
      type: "POST",
      data: {
        production_id: productionId,
        workstation_ids: JSON.stringify(workstationIds),
        scheduled_start: scheduledStart,
        csrfmiddlewaretoken: '{{ csrf_token }}'
      },
      success: function(response) {
        if (response.end_date) {
          const formatted = response.end_date.replace(" ", "T");
          $('#id_scheduled_end').val(formatted);
        }
      }
    });
  });

  // ✅ Submit form
 // ✅ Submit form
$('#scheduleForm').on('submit', function(e) {
    e.preventDefault();
    let assignments = [];
    
    $('#routingContent tbody tr').each(function() {
        const routingDetailId = $(this).data('routing-detail-id');
        const workstationId = $(this).find('.workstation-select').val();
        const machineId = $(this).find('.machine-select').val();
        const employeeSelect = $(this).find('.employee-select');
        
        // Get employee IDs from Selectize
        let employeeIds = [];
        const selectize = employeeSelect[0].selectize;
        if (selectize) {
            employeeIds = selectize.getValue();
        } else {
            // Fallback to regular select
            employeeIds = employeeSelect.val() || [];
        }
        
        console.log(`Row data:`, {
            routingDetailId,
            workstationId,
            machineId,
            employeeIds
        });
        
        if (routingDetailId && workstationId) {
            assignments.push({ 
                routing_detail_id: routingDetailId, 
                workstation_id: workstationId,
                machine_id: machineId,
                employee_ids: employeeIds
            });
        }
    });
    
    console.log("Final assignments data:", assignments);
    $('#assignments_json').val(JSON.stringify(assignments));
    
    // Also update shift table JSON if needed
    const shiftTableData = window.shiftTableData || [];
    $('#shift_table_json').val(JSON.stringify(shiftTableData));
    
    this.submit();
});
});
</script>
