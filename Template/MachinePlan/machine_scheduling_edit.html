{% extends "bootstrap/vertical_base.html" %}
{% load static %}
{% block extra_css %}
<!-- Select2 css -->
<link href="{% static 'css/vendor/select2.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Daterangepicker css -->
<link href="{% static 'css/vendor/daterangepicker.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Touchspin css -->
<link href="{% static 'css/vendor/jquery.bootstrap-touchspin.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Flatpickr Timepicker css -->
<link href="{% static 'css/vendor/flatpickr.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Datepicker css -->
<link href="{% static 'css/vendor/bootstrap-datepicker.min.css' %}" rel="stylesheet" type="text/css" />
<!-- Bootstrap Timepicker css -->
<link href="{% static 'css/vendor/bootstrap-timepicker.min.css' %}" rel="stylesheet" type="text/css" />
<link href="{% static 'css/vendor/fullcalendar.min.css' %}" rel="stylesheet" type="text/css" />


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="{% static 'css/inputs.css' %}" rel="stylesheet" type="text/css" >

<!-- Selectize.js CSS -->
<link href="{% static 'css/selectize.min.css' %}" rel="stylesheet" type="text/css" >
<link href="{% static 'css/form_builder.css' %}" rel="stylesheet" type="text/css" >
{% endblock %} 
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-calendar-week me-2"></i>Edit Machine Planning</h2>
</div>

<div class="container-fluid">
  <div class="card mb-3">
    <form method="post" id="scheduleForm" action="{% url 'mcp:machine_scheduling_update' schedule.id %}">
      {% csrf_token %}
      <div class="card-header bg-primary text-white">General Info</div>
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Schedule Name</label>
            <input type="text" name="name" class="form-control" value="{{ schedule.name }}">
          </div>

          <div class="col-md-4">
            <label class="form-label">Production Order</label>
            <select name="production_order" id="id_production_order" class="form-select" disabled>
              {% for po in production_orders %}
              <option value="{{ po.id }}" {% if schedule.production_order_id == po.id %}selected{% endif %}>
                {{ po.order_number }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Component</label>
            <select name="component" id="id_component" class="form-select" disabled>
              {% for comp in components %}
              <option value="{{ comp.id }}" {% if schedule.component_id == comp.id %}selected{% endif %}>
                {{ comp.name }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Calendar -->
        <div id="calendar" class="mt-4"></div>

        <!-- Scheduled Dates -->
        <div class="row mt-4">
          <div class="col-md-6">
            <label for="id_scheduled_start" class="form-label">Scheduled Start</label>
            <input type="datetime-local" id="id_scheduled_start" name="scheduled_start" class="form-control"
              value="{{ schedule.scheduled_start|date:'Y-m-d\\TH:i' }}">
          </div>

          <div class="col-md-6">
            <label for="id_scheduled_end" class="form-label">Scheduled End</label>
            <input type="datetime-local" id="id_scheduled_end" name="scheduled_end" class="form-control"
              value="{{ schedule.scheduled_end|date:'Y-m-d\\TH:i' }}">
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-md-12 text-end">
            <button type="button" id="calculateEndDateBtn" class="btn btn-warning">
              <i class="bi bi-calculator me-1"></i> Calculate End Date
            </button>
          </div>
        </div>

        <!-- Routing details -->
        <div id="routing-card" class="card mb-3 mt-4">
          <div class="card-header bg-info text-white">Routing & Operations</div>
          <div class="card-body">
            <div id="routingContent"></div>
          </div>
        </div>

        <input type="hidden" id="assignments_json" name="assignments_json" value="{{ assignments_json|default:'[]' }}">

        <!-- Save / Cancel -->
        <div class="d-flex justify-content-between mb-4">
          <a href="{% url 'mcp:machine_scheduling_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update Plan</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/vendor/fullcalendar.min.js' %}"></script>

<script>
let calendar;
$(document).ready(function() {
  const componentId = "{{ schedule.component_id }}";
  const start = "{{ schedule.scheduled_start|date:'Y-m-d\\TH:i' }}";
  const end = "{{ schedule.scheduled_end|date:'Y-m-d\\TH:i' }}";
  const preAssignments = JSON.parse($('#assignments_json').val());

  // 🔹 Load routing + calendar on load
  if (componentId) {
    $.ajax({
      url: "{% url 'mcp:get_routing_data' %}",
      type: "POST",
      data: {
        component_id: componentId,
        csrfmiddlewaretoken: '{{ csrf_token }}'
      },
      success: function(response) {
        if (response.routing_id) window.currentRoutingId = response.routing_id;

        // Render calendar with existing schedule
        if (response.schedules && response.schedules.length > 0)
          renderFullCalendar(response.schedules);
        else
          renderFullCalendar([]);

        // Load routing table
        loadRoutingDetails(window.currentRoutingId, preAssignments);
      },
      error: function() {
        alert("Error loading routing data.");
      }
    });
  }

  function renderFullCalendar(scheduleData) {
    if (calendar) calendar.destroy();

    const events = scheduleData.map(item => ({
      title: "Production: " + item.production_order,
      start: item.start_date,
      end: item.end_date,
      allDay: true,
      backgroundColor: '#4099ff'
    }));

    // add this schedule itself if exists
    if (start && end) {
      events.push({
        title: "Current Schedule",
        start: start,
        end: end,
        allDay: true,
        backgroundColor: '#0d6efd'
      });
    }

    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      height: 650,
      headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
      events: events,
      themeSystem: 'bootstrap5'
    });

    calendar.render();
  }

  function loadRoutingDetails(routingId, preAssignments) {
    $.ajax({
      url: "{% url 'mcp:get_routing_details' %}",
      type: "GET",
      data: { routing_id: routingId },
      success: function(response) {
        if (response.routing_details && response.routing_details.length > 0)
          renderRoutingDetailsTable(response.routing_details, preAssignments);
      }
    });
  }

  function renderRoutingDetailsTable(preAssignments) {
  let tableHtml = `
    <table class="table table-bordered mt-3">
      <thead class="table-primary">
        <tr>
          <th>Seq</th>
          <th>Operation</th>
          <th>Emp Needed</th>
          <th>Proficiency</th>
          <th>Skill</th>
          <th>Work Center</th>
          <th>Workstation</th>
        </tr>
      </thead>
      <tbody>
  `;

  preAssignments.forEach(d => {
    const preselectedId = d.workstation_id || "";

    tableHtml += `
      <tr data-routing-detail-id="${d.routing_detail_id}">
        <td>${d.sequence}</td>
        <td>${d.operation}</td>
        <td>${d.employee_needed}</td>
        <td>${d.proficiency}</td>
        <td>${d.skill}</td>
        <td>${d.work_center}</td>
        <td>
          <select class="form-select workstation-select">
            <option value="">-- Select Workstation --</option>
            ${
              d.workstations && d.workstations.length
                ? d.workstations
                    .map(
                      ws => `
                      <option value="${ws.id}" ${ws.id == preselectedId ? "selected" : ""}>
                        ${ws.name} (${ws.employee_count} Employees)
                      </option>`
                    )
                    .join("")
                : `<option value="">No Workstations Available</option>`
            }
          </select>
        </td>
      </tr>`;
  });

  tableHtml += `</tbody></table>`;
  $("#routingContent").html(tableHtml);
}




  // ✅ Keep calculate end date same as create page
  $('#calculateEndDateBtn').on('click', function() {
    const productionId = $('#id_production_order').val();
    const scheduledStart = $('#id_scheduled_start').val();
    let workstationIds = [];
    $('.workstation-select').each(function() {
      const wsId = $(this).val();
      if (wsId) workstationIds.push(wsId);
    });

    $.ajax({
      url: "{% url 'mcp:calculate_end_date' %}",
      type: "POST",
      data: {
        production_id: productionId,
        workstation_ids: JSON.stringify(workstationIds),
        scheduled_start: scheduledStart,
        csrfmiddlewaretoken: '{{ csrf_token }}'
      },
      success: function(response) {
        if (response.end_date) {
          const formatted = response.end_date.replace(" ", "T");
          $('#id_scheduled_end').val(formatted);
        }
      }
    });
  });

  // ✅ Submit form
  $('#scheduleForm').on('submit', function(e) {
    e.preventDefault();
    let assignments = [];
    $('#routingContent tbody tr').each(function() {
      const routingDetailId = $(this).data('routing-detail-id');
      const workstationId = $(this).find('.workstation-select').val();
      const start = $('#id_scheduled_start').val();
      const end = $('#id_scheduled_end').val();
      if (routingDetailId && workstationId) {
        assignments.push({ routing_detail_id: routingDetailId, workstation_id: workstationId, start, end });
      }
    });
    $('#assignments_json').val(JSON.stringify(assignments));
    this.submit();
  });
});
</script>




{% block extra_javascript %}
<!-- Third party js -->
<script src="{% static 'js/vendor/handlebars.min.js' %}"></script>
<script src="{% static 'js/vendor/typeahead.bundle.min.js' %}"></script>
<script src="{% static 'js/vendor/bootstrap-timepicker.min.js' %}"></script>
<script src="{% static 'js/vendor/flatpickr.min.js' %}"></script>
<script src="{% static 'js/selectize.min.js' %}"></script>
<!-- Init js -->
<script src="{% static 'js/pages/demo.typehead.js' %}"></script>
<script src="{% static 'js/pages/demo.timepicker.js' %}"></script>
{% endblock %}

{% endblock %}
